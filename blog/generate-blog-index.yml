name: Auto-generate Blog Index

on:
  push:
    paths:
      - 'blog/**.html'        # runs whenever any blog HTML is added or edited
  workflow_dispatch:          # also allows manual run from GitHub Actions tab

jobs:
  build-index:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Generate blog/index.html
        run: |
          python3 << 'PYEOF'
          import os, re, json
          from pathlib import Path

          BLOG_DIR = Path("blog")
          OUTPUT   = BLOG_DIR / "index.html"

          # ── files to skip ──────────────────────────────────────────────
          SKIP = {"index.html"}

          # ── emoji + category lookup by filename keyword ─────────────────
          # Extend this dict whenever you add a new topic
          CATEGORIES = [
            (["labour-code"],            ("⚖️",  "Labour Code")),
            (["egr", "gold"],            ("🥇",  "Investing")),
            (["inhand", "in-hand","ctc-vs"],("💰","Salary Guide")),
            (["tax-regime","old-vs-new"],("📋",  "Tax Planning")),
            (["ctc-vs"],                 ("🧮",  "Salary Basics")),
            (["salary-slip","payslip"],  ("🧾",  "Pay Slip Guide")),
            (["epf","pf-guide"],         ("🏦",  "EPF / PF Guide")),
            (["hra"],                    ("🏠",  "Tax Savings")),
            (["negotiate"],              ("🤝",  "Career & Salary")),
            (["data-scientist"],         ("📊",  "Tech Salaries")),
            (["tcs","infosys","wipro",
              "accenture","cognizant"],  ("💼",  "Company Salaries")),
            (["teacher","ias","ips",
              "government"],            ("🏛️",  "Government Jobs")),
            (["layoff"],                 ("🛟",  "Career & Rights")),
            (["pan"],                    ("🪪",  "Tax Basics")),
            (["flat","hoskote","property",
              "emi","real-estate"],      ("🏗️",  "Property & EMI")),
            (["ekhata","eswathu",
              "khata","qr"],            ("📄",  "Property & Karnataka")),
          ]

          DEFAULT_EMOJI    = "📝"
          DEFAULT_CATEGORY = "Guide"

          def guess_meta(slug):
            s = slug.lower()
            for keys, (emoji, cat) in CATEGORIES:
              if any(k in s for k in keys):
                return emoji, cat
            return DEFAULT_EMOJI, DEFAULT_CATEGORY

          def extract_meta(html_path):
            text = html_path.read_text(encoding="utf-8", errors="ignore")
            # title
            m = re.search(r"<title>(.*?)</title>", text, re.I | re.S)
            title = m.group(1).strip() if m else html_path.stem.replace("-", " ").title()
            # strip site suffix like " | SalaryBit"
            title = re.sub(r"\s*[|\-–]\s*SalaryBit.*$", "", title, flags=re.I).strip()
            # description
            m = re.search(r'<meta[^>]+name=["\']description["\'][^>]+content=["\'](.*?)["\']', text, re.I | re.S)
            desc = m.group(1).strip() if m else ""
            if not desc:
              m = re.search(r'<meta[^>]+content=["\'](.*?)["\'][^>]+name=["\']description["\']', text, re.I | re.S)
              desc = m.group(1).strip() if m else "Read the full guide on SalaryBit."
            # read time — count words in <body>
            body = re.sub(r"<[^>]+>", " ", text)
            words = len(body.split())
            mins  = max(4, round(words / 200))
            return title, desc[:200], mins

          # ── collect all blog files ──────────────────────────────────────
          articles = []
          for f in sorted(BLOG_DIR.glob("*.html")):
            if f.name in SKIP:
              continue
            slug    = f.stem
            title, desc, mins = extract_meta(f)
            emoji, cat = guess_meta(slug)
            # detect "new" badges for files modified recently (within 30 days)
            import time
            mtime   = f.stat().st_mtime
            age_days = (time.time() - mtime) / 86400
            is_new  = age_days < 30
            articles.append({
              "file": f.name,
              "slug": slug,
              "title": title,
              "desc": desc,
              "mins": mins,
              "emoji": emoji,
              "cat": cat,
              "new": is_new,
            })

          # ── render cards ────────────────────────────────────────────────
          def card(a):
            badge = ""
            border_style = ""
            if a["new"]:
              badge = '<div class="badge-new">🆕 NEW</div>'
              border_style = ' style="border:2px solid #10b981;"'
            return f'''    <div class="card-wrap">
          {badge}
          <a class="article-card" href="/blog/{a["file"]}"{border_style}>
            <div class="emoji">{a["emoji"]}</div>
            <div class="category">{a["cat"]}</div>
            <h2>{a["title"]}</h2>
            <p>{a["desc"]}</p>
            <div class="meta"><span>{a["mins"]} min read</span><span class="read-link">Read Guide →</span></div>
          </a>
        </div>'''

          cards_html = "\n".join(card(a) for a in articles)
          count = len(articles)

          # ── full page ───────────────────────────────────────────────────
          page = f"""<!DOCTYPE html>
          <html lang="en">
          <head>
            <meta charset="UTF-8"/>
            <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
            <title>Salary &amp; Tax Guides for Indian Professionals | SalaryBit Blog</title>
            <meta name="description" content="Free in-depth guides on salary, tax regime, PF, HRA, salary negotiation and more — written for Indian salaried professionals."/>
            <link rel="canonical" href="https://salarybit.in/blog/"/>
            <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'><rect width='32' height='32' rx='8' fill='%235b6af0'/><text y='22' x='5' font-size='18'>💰</text></svg>">
            <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@300;400;500;600;700&family=DM+Serif+Display&display=swap" rel="stylesheet"/>
            <script async src="https://pagead2.googlesyndication.com/pagead/js/adsbygoogle.js?client=ca-pub-8336334158316485" crossorigin="anonymous"></script>
            <script async src="https://www.googletagmanager.com/gtag/js?id=G-QFHT4BZTMF"></script>
            <script>window.dataLayer=window.dataLayer||[];function gtag(){{dataLayer.push(arguments);}}gtag('js',new Date());gtag('config','G-QFHT4BZTMF');</script>
            <style>
              :root{{--ink:#1a1a2e;--ink3:#4a4a6a;--mist:#7b7b9d;--snow:#f7f7fc;--white:#fff;--accent:#5b6af0;--teal:#0ea5a0;--border:#e2e2f0;--pale:#eeeef6;--r:12px;}}
              *,*::before,*::after{{box-sizing:border-box;margin:0;padding:0}}
              body{{font-family:'DM Sans',sans-serif;background:var(--snow);color:var(--ink);line-height:1.6;-webkit-font-smoothing:antialiased}}
              a{{text-decoration:none;color:inherit}}
              nav{{background:rgba(247,247,252,.97);backdrop-filter:blur(20px);position:sticky;top:0;z-index:100;border-bottom:1px solid var(--border);padding:0 1.5rem;height:54px;display:flex;align-items:center;justify-content:space-between}}
              .brand{{display:flex;align-items:center;gap:8px;font-family:'DM Serif Display',serif;font-size:18px;color:var(--ink)}}
              .brand-mark{{width:30px;height:30px;border-radius:8px;background:linear-gradient(135deg,var(--accent),var(--teal));display:flex;align-items:center;justify-content:center;font-size:14px}}
              .nav-right{{display:flex;align-items:center;gap:12px}}
              .nav-link{{font-size:12px;font-weight:500;color:var(--mist);padding:5px 10px;border-radius:6px}}
              .nav-link:hover{{background:var(--pale);color:var(--ink)}}
              .nav-cta{{font-size:12px;font-weight:700;background:linear-gradient(135deg,var(--accent),var(--teal));color:#fff;padding:6px 16px;border-radius:20px}}
              .hero-blog{{background:linear-gradient(135deg,var(--ink) 0%,#2d2d4a 100%);color:#fff;padding:3.5rem 1.5rem 3rem;text-align:center}}
              .hero-blog .tag{{display:inline-block;background:rgba(255,255,255,.1);border:1px solid rgba(255,255,255,.2);color:rgba(255,255,255,.7);font-size:10px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;padding:4px 12px;border-radius:20px;margin-bottom:1rem}}
              .hero-blog h1{{font-family:'DM Serif Display',serif;font-size:clamp(1.8rem,4vw,2.8rem);color:#fff;margin-bottom:.75rem;line-height:1.2}}
              .hero-blog p{{font-size:14px;color:rgba(255,255,255,.55);max-width:500px;margin:0 auto}}
              .container{{max-width:1100px;margin:0 auto;padding:3rem 1.5rem}}
              .section-label{{font-size:11px;font-weight:700;text-transform:uppercase;letter-spacing:.08em;color:var(--mist);margin-bottom:1.5rem}}
              .articles-grid{{display:grid;grid-template-columns:repeat(auto-fill,minmax(320px,1fr));gap:1.5rem}}
              .card-wrap{{position:relative}}
              .article-card{{background:var(--white);border:1px solid var(--border);border-radius:var(--r);padding:1.5rem;transition:.2s;display:flex;flex-direction:column}}
              .article-card:hover{{border-color:var(--accent);box-shadow:0 4px 20px rgba(91,106,240,.12);transform:translateY(-2px)}}
              .article-card .emoji{{font-size:2rem;margin-bottom:.75rem}}
              .article-card .category{{font-size:10px;font-weight:700;text-transform:uppercase;letter-spacing:.07em;color:var(--accent);margin-bottom:.5rem}}
              .article-card h2{{font-family:'DM Serif Display',serif;font-size:1.1rem;color:var(--ink);margin-bottom:.5rem;line-height:1.3}}
              .article-card p{{font-size:13px;color:var(--mist);line-height:1.55;flex:1;margin-bottom:1rem}}
              .article-card .meta{{font-size:11px;color:var(--mist);display:flex;align-items:center;justify-content:space-between}}
              .read-link{{font-size:12px;font-weight:700;color:var(--accent);display:flex;align-items:center;gap:4px}}
              .badge-new{{position:absolute;top:-10px;left:16px;background:#10b981;color:#fff;font-size:10px;font-weight:700;padding:2px 10px;border-radius:10px;letter-spacing:.06em;z-index:1}}
              .cta-strip{{background:linear-gradient(135deg,var(--accent),var(--teal));border-radius:var(--r);padding:2.5rem;text-align:center;margin-top:3rem;color:#fff}}
              .cta-strip h3{{font-family:'DM Serif Display',serif;font-size:1.6rem;margin-bottom:.5rem}}
              .cta-strip p{{font-size:14px;opacity:.85;margin-bottom:1.25rem}}
              .cta-strip a{{display:inline-block;background:#fff;color:var(--accent);padding:10px 28px;border-radius:20px;font-weight:700;font-size:14px}}
              footer{{text-align:center;padding:2rem 1rem;color:var(--mist);font-size:12px;border-top:1px solid var(--border)}}
              footer a{{color:var(--mist);margin:0 8px}}
              @media(max-width:640px){{.articles-grid{{grid-template-columns:1fr}}}}
            </style>
          </head>
          <body>
          <nav>
            <a class="brand" href="/"><div class="brand-mark">💰</div>SalaryBit</a>
            <div class="nav-right">
              <a class="nav-link" href="/">Calculator</a>
              <a class="nav-link" href="/about.html">About</a>
              <a class="nav-cta" href="/">Try Calculator →</a>
            </div>
          </nav>
          <div class="hero-blog">
            <div class="tag">Free Guides</div>
            <h1>Salary &amp; Tax Guides for<br>Indian Professionals</h1>
            <p>In-depth, jargon-free articles to help you understand your salary, save tax legally, and make better financial decisions.</p>
          </div>
          <div class="container">
            <div class="section-label">All {count} Articles — Updated FY 2026-27</div>
            <div class="articles-grid">
          {cards_html}
            </div>
            <div class="cta-strip">
              <h3>Calculate Your Exact Salary</h3>
              <p>Use SalaryBit's free calculator to see your in-hand salary, compare tax regimes, and plan smarter — no login needed.</p>
              <a href="/">Open Calculator →</a>
            </div>
          </div>
          <footer>
            <p>© 2026 SalaryBit · Free · No login · No data collected</p>
            <p style="margin-top:8px"><a href="/">Home</a><a href="/about.html">About</a><a href="/blog/">Blog</a></p>
          </footer>
          </body>
          </html>"""

          OUTPUT.write_text(page, encoding="utf-8")
          print(f"✅ Generated blog/index.html with {count} articles.")
          PYEOF

      - name: Commit updated index
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add blog/index.html
          git diff --cached --quiet || git commit -m "chore: auto-update blog/index.html [skip ci]"
          git push
