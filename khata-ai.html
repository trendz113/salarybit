KEY CONCEPTS:

Khata / e-Khata:
- A Khata is a property account record showing you pay property tax — issued by the local body
- e-Khata is the digital Khata on bbmpeaasthi.karnataka.gov.in
- Khata is NOT a title deed — it does not prove ownership, only that tax is being paid

- Khata is required for: building plan approval, electricity/water connection, selling/buying property, bank loans

How to Apply for e-Khata (GP or DC converted property):
1. Confirm property is listed on e-Swathu (Form 9 or Form 11)
2. Collect documents: registered sale deed, DC conversion order, earlier Khata (if any), property tax receipts, Aadhaar card, site sketch/plan

  var prompt = activePortal
    ? '[User is asking specifically about ' + ({ bbmp: 'BBMP Aasthi', eaasthi: 'Eaasthi', eswathu: 'e-Swathu / e-Khata' }[activePortal]) + ']\n\n' + text
    : text;

  conversationHistory.push({ role: 'user', parts: [{ text: prompt }] });

  // Cap history to last 6 messages to avoid quota waste and large payloads
  if (conversationHistory.length > 6) {
    conversationHistory = conversationHistory.slice(-6);
  }

  var typingId = addTyping();
  setLoading(true);

  try {
    var reply = await callGeminiWithRetry();
    removeTyping(typingId);
    var portal = detectPortal(text + ' ' + reply);
    var showCTA = shouldShowCTA(text + ' ' + reply);
    addBotMessage(portal, reply, showCTA);
    conversationHistory.push({ role: 'model', parts: [{ text: reply }] });
  } catch (err) {
    removeTyping(typingId);
    addError(err.message);
  }

  setLoading(false);
}

/* ═══════════════════════════════════════════════
   GEMINI API — WITH RETRY ON 429
   ═══════════════════════════════════════════════ */
async function callGeminiWithRetry() {
  try {
    return await callGemini();
  } catch (err) {
    // On rate limit, wait 5 seconds and retry once automatically
    if (err.message && err.message.includes('Too many requests')) {
      await new Promise(function(resolve) { setTimeout(resolve, 5000); });
      try {
        return await callGemini();
      } catch (retryErr) {
        throw new Error('Still too busy — please try again in a few seconds.');
      }
    }
    throw err;
  }
}

async function callGemini() {
  if (CONFIG.GEMINI_API_KEY === 'YOUR_GEMINI_API_KEY_HERE') {
    throw new Error('Gemini API key not set. Open this file and replace YOUR_GEMINI_API_KEY_HERE with your actual key from aistudio.google.com');
  }

  var url = 'https://generativelanguage.googleapis.com/v1beta/models/' +
    CONFIG.MODEL + ':generateContent?key=' + CONFIG.GEMINI_API_KEY;

  var res = await fetch(url, {
    method: 'POST',
    headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify({
      system_instruction: { parts: [{ text: SYSTEM_PROMPT }] },
      contents: conversationHistory,
      generationConfig: { maxOutputTokens: CONFIG.MAX_TOKENS, temperature: 0.4 }
    })
  });

  if (!res.ok) {
    var err = await res.json().catch(function () { return {}; });
    var msg = (err.error && err.error.message) || ('API error ' + res.status);
    if (res.status === 400) msg = 'Invalid API key. Check your Gemini API key in the config.';
    if (res.status === 429) msg = 'Too many requests — retrying automatically…';
    if (res.status === 403) msg = 'API key not allowed from this domain. Check your key restrictions in Google Cloud Console.';
    throw new Error(msg);
  }

  var data = await res.json();
  var text = data.candidates &&
    data.candidates[0] &&
    data.candidates[0].content &&
    data.candidates[0].content.parts &&
    data.candidates[0].content.parts[0] &&
    data.candidates[0].content.parts[0].text;

  if (!text) throw new Error('No response from AI. Please try again.');
  return text;
}

/* ═══════════════════════════════════════════════
   PORTAL DETECTION & CTA
   ═══════════════════════════════════════════════ */
function detectPortal(text) {
  var t = text.toLowerCase();
  if (t.includes('e-swathu') || t.includes('eswathu') || t.includes('form 9') || t.includes('form 11') || t.includes('gram panchayat') || t.includes('dc conver') || t.includes('e-khata') || t.includes('ekhata')) return 'eswathu';
  if (t.includes('eaasthi') || t.includes('e-aasthi') || t.includes('mysuru') || t.includes('hubballi') || t.includes('mangaluru') || t.includes('belagavi') || t.includes('davangere') || t.includes('city corporation')) return 'eaasthi';
  if (t.includes('bbmp') || t.includes('aasthi') || t.includes('sas number') || t.includes('bengaluru') || t.includes('bangalore')) return 'bbmp';
  return 'all';
}

function shouldShowCTA(text) {
  var t = text.toLowerCase();
  return t.includes('e-khata') || t.includes('ekhata') || t.includes('e-swathu') || t.includes('apply') || t.includes('document') || t.includes('assist');
}

/* ═══════════════════════════════════════════════
   UI BUILDERS
   ═══════════════════════════════════════════════ */
function addUserMessage(text) {

  var row = document.createElement('div');

  var bubble = document.createElement('div');
  bubble.className = 'bubble user';
  bubble.textContent = text;
  row.appendChild(bubble);
  chat.appendChild(row);
  scrollBottom();
}

function addBotMessage(portal, text, showCTA) {
  var chat = document.getElementById('chat-body');
  var row = document.createElement('div');
  row.className = 'msg-row';

  var avatar = document.createElement('div');
  avatar.className = 'avatar';
  avatar.setAttribute('aria-hidden', 'true');
  avatar.textContent = '🏠';

  var inner = document.createElement('div');
  inner.style.maxWidth = '80%';

  var bubble = document.createElement('div');
  bubble.className = 'bubble bot';

  var tagMap = {
    bbmp:     ['🏙️ BBMP Aasthi',        'ptag-bbmp'],
    eaasthi:  ['🏛️ Eaasthi',            'ptag-eaasthi'],
    eswathu:  ['🌿 e-Swathu / e-Khata', 'ptag-eswathu'],
    all:      ['🗺️ All portals',         'ptag-all']
  };
  var tagInfo = tagMap[portal] || tagMap.all;
  var tag = document.createElement('div');
  tag.className = 'ptag ' + tagInfo[1];
  tag.textContent = tagInfo[0];
  bubble.appendChild(tag);

  var ansDiv = document.createElement('div');
  ansDiv.className = 'answer-text';
  ansDiv.innerHTML = formatAnswer(text);
  bubble.appendChild(ansDiv);

  if (showCTA) {
    var cta = document.createElement('div');
    cta.className = 'service-cta';
    cta.innerHTML =
      '<div class="cta-text">' +
      '<strong>Need help with e-Swathu / e-Khata?</strong>' +
      'SalaryBit checks the portal and applies for you — ₹125 flat, no office visit needed.' +
      '</div>' +
      '<a class="cta-btn" href="https://salarybit.in/eswathu.html" target="_blank" rel="noopener">Apply Now →</a>';
    bubble.appendChild(cta);
  }

  inner.appendChild(bubble);
  row.appendChild(avatar);
  row.appendChild(inner);
  chat.appendChild(row);
  scrollBottom();
}

function addError(msg) {
  var chat = document.getElementById('chat-body');
  var row = document.createElement('div');
  row.className = 'msg-row';
  var avatar = document.createElement('div');
  avatar.className = 'avatar';
  avatar.textContent = '⚠️';
  var bubble = document.createElement('div');
  bubble.className = 'bubble error';
  bubble.textContent = msg;
  row.appendChild(avatar);
  row.appendChild(bubble);
  chat.appendChild(row);
  scrollBottom();
}

function addTyping() {
  var chat = document.getElementById('chat-body');
  var id = 'typing-' + Date.now();
  var row = document.createElement('div');
  row.className = 'msg-row';
  row.id = id;
  var avatar = document.createElement('div');
  avatar.className = 'avatar';
  avatar.textContent = '🏠';
  var bubble = document.createElement('div');
  bubble.className = 'bubble bot';
  bubble.innerHTML = '<div class="typing"><span></span><span></span><span></span></div>';
  row.appendChild(avatar);
  row.appendChild(bubble);
  chat.appendChild(row);
  scrollBottom();

}

function removeTyping(id) {
  var el = document.getElementById(id);
  if (el) el.remove();
}

/* ═══════════════════════════════════════════════
   FORMAT ANSWER (markdown → HTML)
   ═══════════════════════════════════════════════ */
function formatAnswer(text) {
  text = text
    .replace(/&/g, '&amp;')
    .replace(/</g, '&lt;')
    .replace(/>/g, '&gt;');

  text = text.replace(/\*\*(.+?)\*\*/g, '<strong>$1</strong>');
  text = text.replace(/^[•\-\*] (.+)$/gm, '<li>$1</li>');
  text = text.replace(/(<li>[\s\S]*?<\/li>)+/g, '<ul>$&</ul>');
  text = text.replace(/^\d+\. (.+)$/gm, '<li>$1</li>');
  text = text.replace(/^### (.+)$/gm, '<h3>$1</h3>');
  text = text.replace(/^## (.+)$/gm, '<h3>$1</h3>');
  text = text.replace(/\[([^\]]+)\]\((https?:\/\/[^\)]+)\)/g, '<a href="$2" target="_blank" rel="noopener">$1</a>');

  var paras = text.split(/\n\n+/);
  return paras.map(function (p) {
    p = p.trim();
    if (!p) return '';
    if (p.startsWith('<ul>') || p.startsWith('<h3>') || p.startsWith('<ol>')) return p;
    p = p.replace(/\n/g, '<br>');
    return '<p>' + p + '</p>';
  }).join('');
}

/* ═══════════════════════════════════════════════
   HELPERS
   ═══════════════════════════════════════════════ */
function setLoading(state) {
  isLoading = state;
  document.getElementById('send-btn').disabled = state;
}

function hideSuggestions() {
  document.getElementById('suggestions').style.display = 'none';
}

function scrollBottom() {
  var chat = document.getElementById('chat-body');
  chat.scrollTop = chat.scrollHeight;
}
