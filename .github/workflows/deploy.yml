name: Deploy with API Key

on:
  push:
    branches:
      - main

permissions:
  contents: write        # ← this line fixes the push permission error

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Inject Gemini API key
        run: |
          sed -i "s/YOUR_GEMINI_API_KEY_HERE/${{ secrets.GEMINI_API_KEY }}/g" khata-ai.html

      - name: Commit injected file
        run: |
          git config user.name "github-actions"
          git config user.email "github-actions@github.com"
          git add khata-ai.html
          git diff --staged --quiet || git commit -m "Inject API key [skip ci]"
          git push
