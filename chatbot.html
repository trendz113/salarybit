<style>
#sb-bubble { position:fixed; bottom:24px; right:24px; width:52px;
  height:52px; border-radius:50%; background:#F97316; border:none;
  cursor:pointer; font-size:22px; box-shadow:0 4px 16px rgba(0,0,0,.2);
  z-index:9999; color:#fff; }
#sb-box { display:none; position:fixed; bottom:88px; right:24px;
  width:320px; height:440px; background:#fff; border-radius:16px;
  box-shadow:0 8px 32px rgba(0,0,0,.15); flex-direction:column;
  z-index:9999; overflow:hidden; font-family:sans-serif; }
#sb-header { background:#F97316; color:#fff; padding:12px 16px;
  font-weight:600; font-size:14px; display:flex;
  justify-content:space-between; align-items:center; }
#sb-msgs { flex:1; overflow-y:auto; padding:12px;
  display:flex; flex-direction:column; gap:8px; }
.sb-msg { max-width:85%; padding:9px 12px; border-radius:12px;
  font-size:13px; line-height:1.5; }
.sb-user { background:#FFF7ED; color:#1a1a1a; align-self:flex-end;
  border:1px solid #FDBA74; }
.sb-bot { background:#f1f5f9; color:#1a1a1a; align-self:flex-start; }
#sb-row { display:flex; padding:8px; border-top:1px solid #eee; gap:6px; }
#sb-input { flex:1; border:1px solid #ddd; border-radius:8px;
  padding:7px 11px; font-size:13px; outline:none; }
#sb-send { background:#F97316; color:#fff; border:none;
  border-radius:8px; padding:7px 13px; cursor:pointer; font-size:13px; }
</style>

<button id="sb-bubble" onclick="sbToggle()">💬</button>
<div id="sb-box" style="display:flex">
  <div id="sb-header">
    <span>SalaryBit Assistant</span>
    <span onclick="sbToggle()" style="cursor:pointer">✕</span>
  </div>
  <div id="sb-msgs">
    <div class="sb-msg sb-bot">
      Hi! Ask me about salary, tax, or HRA 👋
    </div>
  </div>
  <div id="sb-row">
    <input id="sb-input" placeholder="e.g. My CTC is 12L, tax?"
      onkeydown="if(event.key==='Enter') sbSend()" />
    <button id="sb-send" onclick="sbSend()">Send</button>
  </div>
</div>

<script>
const GROQ_KEY = "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"; // replace this
const SYS = `You are a concise Indian salary & tax assistant for
SalaryBit. Use FY2025-26 slabs. Be brief, friendly, use INR ₹.`;

function sbToggle() {
  const b = document.getElementById("sb-box");
  b.style.display = b.style.display === "flex" ? "none" : "flex";
}
function sbAdd(txt, role) {
  const d = document.createElement("div");
  d.className = "sb-msg sb-" + role;
  d.textContent = txt;
  const c = document.getElementById("sb-msgs");
  c.appendChild(d);
  c.scrollTop = c.scrollHeight;
  return d;
}
async function sbSend() {
  const inp = document.getElementById("sb-input");
  const msg = inp.value.trim();
  if (!msg) return;
  inp.value = "";
  sbAdd(msg, "user");
  const typing = sbAdd("Typing...", "bot");
  const res = await fetch(
    "https://api.groq.com/openai/v1/chat/completions",
    {
      method: "POST",
      headers: {
        "Content-Type": "application/json",
        "Authorization": "Bearer " + GROQ_KEY
      },
      body: JSON.stringify({
        model: "llama3-70b-8192",
        max_tokens: 300,
        messages: [
          { role: "system", content: SYS },
          { role: "user", content: msg }
        ]
      })
    }
  );
  const data = await res.json();
  typing.textContent = data.choices[0].message.content;
}
</script>
