name: Inject Secrets & Deploy

on:
  push:
    branches: [ main ]
  workflow_dispatch:        # lets you trigger manually from Actions tab

permissions:
  contents: write           # needed to push to gh-pages branch

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      # ── Create a dist/ folder with keys injected ──────────────────
      - name: Inject GROQ_API_KEY into travel-rewards.html
        run: |
          mkdir -p dist
          # Copy everything to dist
          cp -r . dist/ 2>/dev/null || true
          # Inject the Groq key
          sed "s|%%GROQ_API_KEY%%|${{ secrets.GROQ_API_KEY }}|g" \
            travel-rewards.html > dist/travel-rewards.html
          echo "✅ Key injected. Checking..."
          grep -c "%%GROQ_API_KEY%%" dist/travel-rewards.html && echo "❌ Still has placeholder!" || echo "✅ Placeholder replaced successfully"

      # ── Deploy dist/ to GitHub Pages ──────────────────────────────
      - name: Deploy to GitHub Pages
        uses: peaceiris/actions-gh-pages@v3
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./dist
          publish_branch: gh-pages
          force_orphan: true
