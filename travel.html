<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Travel Deal Alerts - SalaryBit</title>
    <style>
        body { font-family: sans-serif; line-height: 1.6; color: #333; max-width: 800px; margin: 0 auto; padding: 20px; }
        .deal-card { border: 2px solid #007bff; border-radius: 10px; padding: 20px; background: #f8f9fa; text-align: center; }
        .hotel-name { font-size: 1.5rem; font-weight: bold; color: #007bff; }
        .price-box { font-size: 2rem; color: #d9534f; margin: 10px 0; }
        .btn { background: #28a745; color: white; padding: 10px 20px; text-decoration: none; border-radius: 5px; font-weight: bold; display: inline-block; }
        .status { font-size: 0.8rem; color: #666; margin-top: 10px; }
    </style>
</head>
<body>

    <h1>Shadow Stay India: Live Deal Alerts</h1>
    <p>Our robots monitor luxury resort prices every 3 hours. When the price drops, you see it here first.</p>

    <div class="deal-card">
        <div class="hotel-name">Ocean Spray Resort, Pondicherry</div>
        <p>Current Best Price Found:</p>
        <div class="price-box">Rs. <span id="current-price">8,066</span></div>
        
        <a href="YOUR_AFFILIATE_LINK_HERE" class="btn">Check This Deal on Agoda</a>
        
        <div class="status">Last checked by robot: Just now</div>
    </div>

    <hr>
    <p><a href="index.html">← Back to SalaryBit Home</a></p>

</body>
</html>
