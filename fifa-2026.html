<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>FIFA World Cup 2026 Live Scores | SalaryBit</title>
<meta name="description" content="Live scores, results and standings for FIFA World Cup 2026. Updated every 60 seconds.">
<!-- Google Fonts -->
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
  :root {
    --primary: #1a1a2e;
    --secondary: #16213e;
    --accent: #0f3460;
    --gold: #e94560;
    --green: #00b894;
    --yellow: #fdcb6e;
    --text: #f5f5f5;
    --muted: #a0a0b0;
    --card: #1e2040;
    --border: rgba(255,255,255,0.08);
    --live: #ff4757;
  }

  * { margin: 0; padding: 0; box-sizing: border-box; }

  body {
    font-family: 'Inter', sans-serif;
    background: var(--primary);
    color: var(--text);
    min-height: 100vh;
  }

  /* HEADER */
  .header {
    background: linear-gradient(135deg, #0f3460 0%, #16213e 50%, #1a1a2e 100%);
    padding: 20px 16px 16px;
    text-align: center;
    border-bottom: 2px solid var(--gold);
    position: relative;
    overflow: hidden;
  }
  .header::before {
    content: '⚽';
    position: absolute;
    font-size: 120px;
    opacity: 0.04;
    top: -20px;
    right: -20px;
  }
  .header-badge {
    display: inline-block;
    background: var(--gold);
    color: white;
    font-size: 10px;
    font-weight: 700;
    letter-spacing: 1.5px;
    padding: 3px 10px;
    border-radius: 20px;
    margin-bottom: 8px;
    text-transform: uppercase;
  }
  .header h1 {
    font-size: 22px;
    font-weight: 800;
    letter-spacing: -0.5px;
  }
  .header h1 span { color: var(--gold); }
  .header-sub {
    font-size: 12px;
    color: var(--muted);
    margin-top: 4px;
  }
  .host-flags {
    font-size: 20px;
    margin-top: 8px;
    letter-spacing: 4px;
  }

  /* TABS */
  .tabs {
    display: flex;
    background: var(--secondary);
    border-bottom: 1px solid var(--border);
    overflow-x: auto;
    scrollbar-width: none;
  }
  .tabs::-webkit-scrollbar { display: none; }
  .tab {
    flex: 1;
    min-width: 80px;
    padding: 12px 8px;
    text-align: center;
    font-size: 12px;
    font-weight: 600;
    color: var(--muted);
    cursor: pointer;
    border-bottom: 2px solid transparent;
    transition: all 0.2s;
    white-space: nowrap;
  }
  .tab.active {
    color: var(--gold);
    border-bottom-color: var(--gold);
    background: rgba(233,69,96,0.05);
  }
  .tab:hover:not(.active) { color: var(--text); }

  /* STATUS BAR */
  .status-bar {
    display: flex;
    justify-content: space-between;
    align-items: center;
    padding: 8px 16px;
    background: var(--secondary);
    font-size: 11px;
    color: var(--muted);
    border-bottom: 1px solid var(--border);
  }
  .live-dot {
    display: inline-block;
    width: 7px; height: 7px;
    background: var(--live);
    border-radius: 50%;
    margin-right: 5px;
    animation: pulse 1.5s infinite;
  }
  @keyframes pulse {
    0%,100% { opacity: 1; transform: scale(1); }
    50% { opacity: 0.4; transform: scale(0.8); }
  }
  .refresh-btn {
    background: none;
    border: 1px solid var(--border);
    color: var(--muted);
    font-size: 11px;
    padding: 3px 10px;
    border-radius: 12px;
    cursor: pointer;
    transition: all 0.2s;
  }
  .refresh-btn:hover { color: var(--text); border-color: var(--gold); }

  /* MAIN CONTENT */
  .content { padding: 12px 12px 80px; max-width: 600px; margin: 0 auto; }

  /* MATCH CARD */
  .match-card {
    background: var(--card);
    border: 1px solid var(--border);
    border-radius: 12px;
    padding: 14px;
    margin-bottom: 10px;
    transition: transform 0.15s;
    position: relative;
    overflow: hidden;
  }
  .match-card:hover { transform: translateY(-1px); border-color: rgba(233,69,96,0.3); }
  .match-card.live-match {
    border-color: rgba(255,71,87,0.4);
    background: linear-gradient(135deg, #1e2040 0%, #2a1a2e 100%);
  }
  .match-card.live-match::before {
    content: '';
    position: absolute;
    top: 0; left: 0; right: 0;
    height: 2px;
    background: linear-gradient(90deg, var(--live), transparent);
  }

  .match-meta {
    display: flex;
    justify-content: space-between;
    align-items: center;
    margin-bottom: 10px;
  }
  .match-group {
    font-size: 10px;
    color: var(--muted);
    font-weight: 600;
    text-transform: uppercase;
    letter-spacing: 0.8px;
  }
  .match-status {
    font-size: 10px;
    font-weight: 700;
    padding: 2px 8px;
    border-radius: 10px;
  }
  .status-live { background: rgba(255,71,87,0.2); color: var(--live); }
  .status-ft { background: rgba(0,184,148,0.15); color: var(--green); }
  .status-upcoming { background: rgba(160,160,176,0.1); color: var(--muted); }
  .status-ht { background: rgba(253,203,110,0.2); color: var(--yellow); }

  .match-teams {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 8px;
  }
  .team {
    flex: 1;
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 4px;
  }
  .team-flag { font-size: 28px; line-height: 1; }
  .team-name {
    font-size: 12px;
    font-weight: 600;
    text-align: center;
    color: var(--text);
  }
  .score-block {
    display: flex;
    align-items: center;
    gap: 6px;
    min-width: 80px;
    justify-content: center;
  }
  .score {
    font-size: 28px;
    font-weight: 800;
    min-width: 28px;
    text-align: center;
  }
  .score-sep {
    font-size: 20px;
    color: var(--muted);
    font-weight: 300;
  }
  .match-time {
    font-size: 11px;
    color: var(--muted);
    text-align: center;
    margin-top: 8px;
  }
  .match-time.live-time { color: var(--live); font-weight: 700; }

  /* SECTION HEADER */
  .section-head {
    font-size: 11px;
    font-weight: 700;
    letter-spacing: 1px;
    text-transform: uppercase;
    color: var(--muted);
    padding: 12px 0 6px;
    border-bottom: 1px solid var(--border);
    margin-bottom: 10px;
    display: flex;
    align-items: center;
    gap: 6px;
  }

  /* STANDINGS TABLE */
  .standings-group {
    background: var(--card);
    border: 1px solid var(--border);
    border-radius: 12px;
    margin-bottom: 12px;
    overflow: hidden;
  }
  .group-header {
    background: rgba(15,52,96,0.6);
    padding: 10px 14px;
    font-size: 12px;
    font-weight: 700;
    letter-spacing: 0.5px;
    color: var(--gold);
  }
  .standings-table { width: 100%; border-collapse: collapse; }
  .standings-table th {
    font-size: 10px;
    color: var(--muted);
    font-weight: 600;
    padding: 6px 8px;
    text-align: center;
    border-bottom: 1px solid var(--border);
  }
  .standings-table th:first-child { text-align: left; padding-left: 14px; }
  .standings-table td {
    font-size: 12px;
    padding: 9px 8px;
    text-align: center;
    border-bottom: 1px solid rgba(255,255,255,0.03);
  }
  .standings-table td:first-child { text-align: left; padding-left: 14px; }
  .standings-table tr:last-child td { border-bottom: none; }
  .standings-table tr.qualify td { color: var(--text); }
  .standings-table tr.qualify:nth-child(-n+2) td:first-child {
    border-left: 3px solid var(--green);
    padding-left: 11px;
  }
  .team-cell { display: flex; align-items: center; gap: 6px; }
  .team-pos { color: var(--muted); font-size: 11px; min-width: 16px; }
  .pts { font-weight: 700; color: var(--gold); }

  /* LOADER */
  .loader {
    text-align: center;
    padding: 40px 20px;
    color: var(--muted);
  }
  .spinner {
    width: 32px; height: 32px;
    border: 3px solid var(--border);
    border-top-color: var(--gold);
    border-radius: 50%;
    animation: spin 0.8s linear infinite;
    margin: 0 auto 12px;
  }
  @keyframes spin { to { transform: rotate(360deg); } }

  /* ERROR */
  .error-box {
    background: rgba(233,69,96,0.1);
    border: 1px solid rgba(233,69,96,0.3);
    border-radius: 12px;
    padding: 16px;
    text-align: center;
    font-size: 13px;
  }
  .error-box .error-icon { font-size: 28px; margin-bottom: 8px; }

  /* API KEY INPUT */
  .api-setup {
    background: var(--card);
    border: 1px dashed rgba(233,69,96,0.4);
    border-radius: 12px;
    padding: 20px;
    text-align: center;
    margin: 20px 0;
  }
  .api-setup h3 { font-size: 15px; margin-bottom: 8px; }
  .api-setup p { font-size: 12px; color: var(--muted); margin-bottom: 14px; line-height: 1.6; }
  .api-input {
    width: 100%;
    background: var(--secondary);
    border: 1px solid var(--border);
    border-radius: 8px;
    padding: 10px 14px;
    color: var(--text);
    font-size: 13px;
    font-family: monospace;
    margin-bottom: 10px;
    outline: none;
  }
  .api-input:focus { border-color: var(--gold); }
  .api-btn {
    background: var(--gold);
    color: white;
    border: none;
    border-radius: 8px;
    padding: 10px 24px;
    font-size: 13px;
    font-weight: 700;
    cursor: pointer;
    transition: opacity 0.2s;
  }
  .api-btn:hover { opacity: 0.85; }
  .api-link {
    display: block;
    margin-top: 10px;
    font-size: 11px;
    color: var(--muted);
  }
  .api-link a { color: var(--gold); text-decoration: none; }

  /* FOOTER WIDGET CREDIT */
  .footer {
    text-align: center;
    padding: 16px;
    font-size: 11px;
    color: var(--muted);
    border-top: 1px solid var(--border);
    margin-top: 20px;
  }
  .footer a { color: var(--gold); text-decoration: none; }

  /* EMPTY STATE */
  .empty { text-align: center; padding: 30px; color: var(--muted); font-size: 13px; }
  .empty span { font-size: 32px; display: block; margin-bottom: 8px; }

  /* SCORERS */
  .scorer-row {
    display: flex;
    align-items: center;
    padding: 10px 14px;
    border-bottom: 1px solid var(--border);
    gap: 10px;
  }
  .scorer-row:last-child { border-bottom: none; }
  .scorer-rank { font-size: 13px; font-weight: 700; color: var(--gold); min-width: 24px; }
  .scorer-info { flex: 1; }
  .scorer-name { font-size: 13px; font-weight: 600; }
  .scorer-team { font-size: 11px; color: var(--muted); }
  .scorer-goals { font-size: 18px; font-weight: 800; }
</style>
</head>
<body>

<div class="header">
  <div class="header-badge">🏆 Live Tournament</div>
  <h1>FIFA World Cup <span>2026</span></h1>
  <div class="header-sub">USA · Canada · Mexico · Jun 11 – Jul 19</div>
  <div class="host-flags">🇺🇸 🇨🇦 🇲🇽</div>
</div>

<div class="tabs">
  <div class="tab active" onclick="switchTab('scores')">⚽ Scores</div>
  <div class="tab" onclick="switchTab('standings')">📊 Standings</div>
  <div class="tab" onclick="switchTab('scorers')">🥇 Scorers</div>
  <div class="tab" onclick="switchTab('schedule')">📅 Schedule</div>
</div>

<div class="status-bar">
  <div>
    <span class="live-dot"></span>
    <span id="last-updated">Connecting...</span>
  </div>
  <button class="refresh-btn" onclick="loadData()">↻ Refresh</button>
</div>

<div class="content" id="main-content">
  <div class="loader">
    <div class="spinner"></div>
    <div>Loading match data...</div>
  </div>
</div>

<div class="footer">
  Powered by <a href="https://www.football-data.org" target="_blank">football-data.org</a> &nbsp;|&nbsp;
  <a href="https://salarybit.in" target="_blank">SalaryBit.in</a> – India's Salary & Finance Tools
</div>

<script>
// ============================================================
// CONFIG — replace with your football-data.org free API key
// Get free key at: https://www.football-data.org/client/register
// ============================================================
let API_KEY = localStorage.getItem('fdorg_key') || '2c749c3fe0504fd8859b82035a268f47';
const BASE_URL = 'https://api.football-data.org/v4';
const WC_CODE = 'WC';
let activeTab = 'scores';
let refreshTimer = null;

// ============================================================
// INIT
// ============================================================
window.onload = () => {
  if (!API_KEY) {
    showApiSetup();
  } else {
    loadData();
    startAutoRefresh();
  }
};

function startAutoRefresh() {
  clearInterval(refreshTimer);
  refreshTimer = setInterval(loadData, 60000); // every 60s
}

function switchTab(tab) {
  activeTab = tab;
  document.querySelectorAll('.tab').forEach((t, i) => {
    t.classList.toggle('active', ['scores','standings','scorers','schedule'][i] === tab);
  });
  loadData();
}

// ============================================================
// API FETCH
// ============================================================
async function apiFetch(endpoint) {
  const res = await fetch(`https://web-production-456eb.up.railway.app/api/football?endpoint=
  if (!res.ok) throw new Error(`API Error ${res.status}`);
  return res.json();
}

async function loadData() {
  if (!API_KEY) { showApiSetup(); return; }
  updateTimestamp();
  try {
    if (activeTab === 'scores') await loadScores();
    else if (activeTab === 'standings') await loadStandings();
    else if (activeTab === 'scorers') await loadScorers();
    else if (activeTab === 'schedule') await loadSchedule();
  } catch (e) {
    showError(e.message);
  }
}

// ============================================================
// SCORES TAB
// ============================================================
async function loadScores() {
  setContent(loaderHTML());
  const today = new Date();
  const from = formatDate(new Date(today - 2 * 86400000));
  const to = formatDate(new Date(today.getTime() + 1 * 86400000));
  const data = await apiFetch(`/competitions/${WC_CODE}/matches?dateFrom=${from}&dateTo=${to}`);
  const matches = data.matches || [];

  if (!matches.length) {
    setContent(`<div class="empty"><span>📭</span>No matches in this window</div>`);
    return;
  }

  const live = matches.filter(m => ['IN_PLAY','PAUSED','HALFTIME'].includes(m.status));
  const finished = matches.filter(m => m.status === 'FINISHED');
  const upcoming = matches.filter(m => m.status === 'TIMED' || m.status === 'SCHEDULED');

  let html = '';
  if (live.length) {
    html += `<div class="section-head"><span class="live-dot"></span> LIVE NOW</div>`;
    html += live.map(renderMatchCard).join('');
  }
  if (finished.length) {
    html += `<div class="section-head">✅ RESULTS</div>`;
    html += finished.reverse().map(renderMatchCard).join('');
  }
  if (upcoming.length) {
    html += `<div class="section-head">🕐 UPCOMING</div>`;
    html += upcoming.map(renderMatchCard).join('');
  }

  setContent(html);
}

function renderMatchCard(m) {
  const isLive = ['IN_PLAY','PAUSED'].includes(m.status);
  const isHT = m.status === 'HALFTIME';
  const isFT = m.status === 'FINISHED';

  const home = m.homeTeam.name || m.homeTeam.shortName || 'TBD';
  const away = m.awayTeam.name || m.awayTeam.shortName || 'TBD';
  const homeScore = m.score?.fullTime?.home ?? (m.score?.halfTime?.home ?? '–');
  const awayScore = m.score?.fullTime?.away ?? (m.score?.halfTime?.away ?? '–');

  const homeCrest = m.homeTeam.crest
    ? `<img src="${m.homeTeam.crest}" style="width:32px;height:32px;object-fit:contain;" onerror="this.style.display='none'">`
    : getFlagEmoji(home);

  const awayCrest = m.awayTeam.crest
    ? `<img src="${m.awayTeam.crest}" style="width:32px;height:32px;object-fit:contain;" onerror="this.style.display='none'">`
    : getFlagEmoji(away);

  let statusLabel = '';
  let statusClass = '';
  if (isLive) { statusLabel = `${m.minute || '?'}'`; statusClass = 'status-live'; }
  else if (isHT) { statusLabel = 'HT'; statusClass = 'status-ht'; }
  else if (isFT) { statusLabel = 'FT'; statusClass = 'status-ft'; }
  else {
    const d = new Date(m.utcDate);
    statusLabel = d.toLocaleTimeString('en-IN', { hour: '2-digit', minute: '2-digit', timeZone: 'Asia/Kolkata' });
    statusClass = 'status-upcoming';
  }

  const group = m.group ? `Group ${m.group.replace('GROUP_','')}` : (m.stage || '').replace(/_/g,' ');
  const matchDate = new Date(m.utcDate).toLocaleDateString('en-IN', { day:'numeric', month:'short', timeZone:'Asia/Kolkata' });

  return `
  <div class="match-card ${isLive ? 'live-match' : ''}">
    <div class="match-meta">
      <span class="match-group">${group} · ${matchDate}</span>
      <span class="match-status ${statusClass}">${statusLabel}</span>
    </div>
    <div class="match-teams">
      <div class="team">
        <div class="team-flag">${homeCrest}</div>
        <div class="team-name">${home}</div>
      </div>
      <div class="score-block">
        <div class="score">${homeScore}</div>
        <div class="score-sep">–</div>
        <div class="score">${awayScore}</div>
      </div>
      <div class="team">
        <div class="team-flag">${awayCrest}</div>
        <div class="team-name">${away}</div>
      </div>
    </div>
  </div>`;
}

// ============================================================
// STANDINGS TAB
// ============================================================
async function loadStandings() {
  setContent(loaderHTML());
  const data = await apiFetch(`/competitions/${WC_CODE}/standings?season=2026`);
  const groups = data.standings || [];
  if (!groups.length) { setContent(`<div class="empty"><span>📊</span>Standings not available yet</div>`); return; }

  let html = '';
  groups.slice(0,12).forEach(g => {
    const groupName = g.group ? `Group ${g.group.replace('GROUP_','')}` : g.stage;
    html += `<div class="standings-group">
      <div class="group-header">⚽ ${groupName}</div>
      <table class="standings-table">
        <thead><tr>
          <th>Team</th><th>P</th><th>W</th><th>D</th><th>L</th><th>GD</th><th>Pts</th>
        </tr></thead>
        <tbody>`;
    g.table.forEach((row, i) => {
      const team = row.team?.name || row.team?.shortName || '?';
      html += `<tr class="qualify">
        <td><div class="team-cell">
          <span class="team-pos">${row.position}</span>
          ${row.team?.crest ? `<img src="${row.team.crest}" style="width:18px;height:18px;object-fit:contain;">` : ''}
          ${team}
        </div></td>
        <td>${row.playedGames}</td>
        <td>${row.won}</td>
        <td>${row.draw}</td>
        <td>${row.lost}</td>
        <td>${row.goalDifference >= 0 ? '+' : ''}${row.goalDifference}</td>
        <td class="pts">${row.points}</td>
      </tr>`;
    });
    html += `</tbody></table></div>`;
  });
  setContent(html);
}

// ============================================================
// TOP SCORERS TAB
// ============================================================
async function loadScorers() {
  setContent(loaderHTML());
  const data = await apiFetch(`/competitions/${WC_CODE}/scorers?season=2026&limit=20`);
  const scorers = data.scorers || [];
  if (!scorers.length) { setContent(`<div class="empty"><span>🥇</span>Scorers data coming soon</div>`); return; }

  let html = `<div class="standings-group">`;
  scorers.forEach((s, i) => {
    const name = s.player?.name || '?';
    const team = s.team?.name || '?';
    html += `<div class="scorer-row">
      <div class="scorer-rank">${i+1}</div>
      ${s.team?.crest ? `<img src="${s.team.crest}" style="width:24px;height:24px;object-fit:contain;">` : ''}
      <div class="scorer-info">
        <div class="scorer-name">${name}</div>
        <div class="scorer-team">${team}</div>
      </div>
      <div class="scorer-goals">⚽ ${s.goals}</div>
    </div>`;
  });
  html += `</div>`;
  setContent(html);
}

// ============================================================
// SCHEDULE TAB
// ============================================================
async function loadSchedule() {
  setContent(loaderHTML());
  const today = new Date();
  const from = formatDate(today);
  const to = formatDate(new Date(today.getTime() + 7 * 86400000));
  const data = await apiFetch(`/competitions/${WC_CODE}/matches?dateFrom=${from}&dateTo=${to}`);
  const matches = data.matches || [];

  if (!matches.length) {
    setContent(`<div class="empty"><span>📅</span>No upcoming matches in next 7 days</div>`);
    return;
  }

  // Group by date
  const byDate = {};
  matches.forEach(m => {
    const d = new Date(m.utcDate).toLocaleDateString('en-IN', { weekday:'short', day:'numeric', month:'short', timeZone:'Asia/Kolkata' });
    if (!byDate[d]) byDate[d] = [];
    byDate[d].push(m);
  });

  let html = '';
  Object.entries(byDate).forEach(([date, ms]) => {
    html += `<div class="section-head">📅 ${date}</div>`;
    html += ms.map(renderMatchCard).join('');
  });
  setContent(html);
}

// ============================================================
// API SETUP SCREEN
// ============================================================
function showApiSetup() {
  setContent(`
  <div class="api-setup">
    <h3>🔑 Enter Your Free API Key</h3>
    <p>This widget uses <strong>football-data.org</strong> — 100% free for World Cup data.<br>
    Register in 30 seconds and paste your key below.</p>
    <input class="api-input" id="key-input" type="text" placeholder="Paste your API key here..." />
    <button class="api-btn" onclick="saveKey()">Connect →</button>
    <span class="api-link">
      Get free key at <a href="https://www.football-data.org/client/register" target="_blank">football-data.org/client/register</a>
    </span>
  </div>`);
}

function saveKey() {
  const k = document.getElementById('key-input').value.trim();
  if (!k) return;
  API_KEY = k;
  localStorage.setItem('fdorg_key', k);
  loadData();
  startAutoRefresh();
}

// ============================================================
// HELPERS
// ============================================================
function setContent(html) {
  document.getElementById('main-content').innerHTML = html;
}

function loaderHTML() {
  return `<div class="loader"><div class="spinner"></div><div>Loading...</div></div>`;
}

function showError(msg) {
  setContent(`<div class="error-box">
    <div class="error-icon">⚠️</div>
    <div>Could not load data</div>
    <div style="font-size:11px;color:var(--muted);margin-top:6px;">${msg}</div>
    <br>
    <button class="api-btn" style="font-size:12px;" onclick="showApiSetup()">Update API Key</button>
  </div>`);
}

function updateTimestamp() {
  const t = new Date().toLocaleTimeString('en-IN', { hour:'2-digit', minute:'2-digit', timeZone:'Asia/Kolkata' });
  document.getElementById('last-updated').textContent = `Updated ${t} IST`;
}

function formatDate(d) {
  return d.toISOString().split('T')[0];
}

function getFlagEmoji(name) {
  const flags = {
    'Brazil':'🇧🇷','Germany':'🇩🇪','France':'🇫🇷','Argentina':'🇦🇷',
    'Spain':'🇪🇸','England':'🏴󠁧󠁢󠁥󠁮󠁧󠁿','Portugal':'🇵🇹','Netherlands':'🇳🇱',
    'Italy':'🇮🇹','Belgium':'🇧🇪','Croatia':'🇭🇷','Morocco':'🇲🇦',
    'Japan':'🇯🇵','South Korea':'🇰🇷','USA':'🇺🇸','Mexico':'🇲🇽',
    'Canada':'🇨🇦','Australia':'🇦🇺','Senegal':'🇸🇳','Ecuador':'🇪🇨',
    'Uruguay':'🇺🇾','Colombia':'🇨🇴','Poland':'🇵🇱','Switzerland':'🇨🇭',
    'Denmark':'🇩🇰','Serbia':'🇷🇸','Ghana':'🇬🇭','Cameroon':'🇨🇲',
    'Qatar':'🇶🇦','Saudi Arabia':'🇸🇦','Iran':'🇮🇷','Tunisia':'🇹🇳',
    'Costa Rica':'🇨🇷','Wales':'🏴󠁧󠁢󠁷󠁬󠁳󠁿'
  };
  for (const [k,v] of Object.entries(flags)) {
    if (name.includes(k)) return `<span style="font-size:28px">${v}</span>`;
  }
  return `<span style="font-size:28px">🏳</span>`;
}
</script>
