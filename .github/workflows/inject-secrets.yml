name: Inject API Keys & Deploy

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  inject-and-deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Inject Groq API key into travel-rewards.html
        run: |
          sed -i "s|%%GROQ_API_KEY%%|${{ secrets.GROQ_API_KEY }}|g" travel-rewards.html

      - name: Inject Razorpay key (optional, for future use)
        run: |
          sed -i "s|%%RAZORPAY_KEY%%|${{ secrets.RAZORPAY_KEY }}|g" travel-rewards.html || true

      # ── If you use GitHub Pages ──────────────────────
      - name: Deploy to GitHub Pages
        uses: peaceiris/actions-gh-pages@v3
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./
          # publish_branch: gh-pages   # uncomment if needed

